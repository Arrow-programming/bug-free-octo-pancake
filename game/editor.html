<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0">
	<title>World Editor</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #121110;
			--panel: #1d1b19;
			--panel-2: #29241f;
			--line: #51443a;
			--text: #f3eee6;
			--muted: #b5a99b;
			--accent: #e4a15b;
			--gold: #f0c36a;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			overflow: hidden;
			background: radial-gradient(circle at 70% 20%, #3a2a20 0, var(--bg) 44%);
			color: var(--text);
			font: 14px/1.3 system-ui, sans-serif;
		}

		header {
			height: 58px;
			display: flex;
			justify-content: flex-start;
			gap: 8px;
			align-items: center;
			padding: 8px 14px;
			border-bottom: 1px solid var(--line);
			background: rgba(24, 20, 17, .96);
		}

		button,
		select,
		input {
			border: 1px solid var(--line);
			border-radius: 5px;
			background: var(--panel);
			color: var(--text);
			padding: 7px 9px;
		}

		button {
			cursor: pointer;
		}

		button:hover,
		button.active {
			border-color: var(--accent);
			color: var(--accent);
			background: var(--panel-2);
		}

		header button {
			font-size: 12px;
		}

		.material-symbols-rounded {
			font-size: 20px;
			line-height: 1;
			vertical-align: middle;
		}

		.icon-button {
			display: grid;
			place-items: center;
			width: 36px;
			height: 36px;
			padding: 0;
		}

		.toolbar {
			display: flex;
			align-items: center;
			gap: 8px;
		}

		.toolbar-divider {
			width: 1px;
			height: 26px;
			margin: 0 2px;
			background: var(--line);
		}

		.toolbar input[type="checkbox"] {
			position: absolute;
			opacity: 0;
			pointer-events: none;
		}

		.toolbar label {
			display: grid;
			place-items: center;
			width: 36px;
			height: 36px;
			margin: 0;
			border: 1px solid var(--line);
			border-radius: 5px;
			color: var(--muted);
			cursor: pointer;
		}

		.toolbar label:has(input:checked) {
			border-color: var(--accent);
			color: var(--accent);
			background: var(--panel-2);
		}

		.toolbar #zoom {
			width: 100px;
			margin: 0 3px;
		}

		.toolbar #zoom {
			height: 18px;
			accent-color: var(--accent);
			cursor: ew-resize;
		}

		.toolbar #zoom::-webkit-slider-runnable-track {
			height: 4px;
			border: 1px solid var(--line);
			border-radius: 4px;
			background: #30261f;
		}

		.toolbar #zoom::-webkit-slider-thumb {
			width: 14px;
			height: 14px;
			margin-top: -6px;
			border: 2px solid var(--gold);
			border-radius: 50%;
			background: var(--accent);
			appearance: none;
		}

		.toolbar #zoom::-moz-range-track {
			height: 4px;
			border: 1px solid var(--line);
			border-radius: 4px;
			background: #30261f;
		}

		.toolbar #zoom::-moz-range-progress {
			height: 4px;
			border-radius: 4px;
			background: var(--accent);
		}

		.toolbar #zoom::-moz-range-thumb {
			width: 12px;
			height: 12px;
			border: 2px solid var(--gold);
			border-radius: 50%;
			background: var(--accent);
		}

		.toolbar .tool-button {
			color: var(--muted);
		}

		.toolbar .tool-button.active {
			border-color: var(--accent);
			color: var(--accent);
			background: var(--panel-2);
		}

		main {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 68px;
			width: 100vw;
			height: calc(100vh - 58px);
		}

		aside {
			grid-column: 2;
			grid-row: 1;
			overflow: auto;
			padding: 10px;
			border-left: 1px solid var(--line);
			background: rgba(27, 23, 20, .97);
		}

		label,
		.section-title {
			display: block;
			margin: 15px 0 7px;
			color: var(--muted);
			font-size: 11px;
			text-transform: uppercase;
			letter-spacing: .12em;
		}

		.section-title {
			margin-top: 0;
		}

		.control-row {
			display: flex;
			gap: 6px;
		}

		.control-row>* {
			flex: 1;
			min-width: 0;
		}

		#palette {
			display: grid;
			grid-template-columns: 1fr;
			gap: 7px;
		}

		.swatch {
			width: 32px;
			height: 32px;
			justify-self: center;
			display: grid;
			place-items: center;
			padding: 2px;
		}

		.swatch canvas {
			position: static;
			width: 27px;
			height: 27px;
			max-width: 100%;
			max-height: 100%;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
		}

		.check-row {
			display: grid;
			gap: 7px;
			margin: 10px 0;
			color: var(--muted);
			font-size: 12px;
		}

		.check-row label {
			display: grid;
			place-items: center;
			margin: 0;
		}

		#status {
			position: absolute;
			z-index: 3;
			right: 12px;
			bottom: 12px;
			max-width: calc(100% - 24px);
			padding: 7px 10px;
			border: 1px solid rgba(228, 161, 91, .55);
			border-radius: 4px;
			background: rgba(24, 20, 17, .9);
			color: var(--text);
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
			font: 11px monospace;
			pointer-events: none;
		}

		#selectedBlock {
			position: absolute;
			z-index: 3;
			left: 12px;
			bottom: 12px;
			display: flex;
			align-items: center;
			gap: 7px;
			min-width: 42px;
			height: 42px;
			padding: 4px 8px 4px 4px;
			border: 1px solid rgba(228, 161, 91, .55);
			border-radius: 4px;
			background: rgba(24, 20, 17, .9);
			color: var(--text);
			pointer-events: none;
		}

		#selectedBlock canvas {
			width: 32px;
			height: 32px;
			image-rendering: pixelated;
			image-rendering: crisp-edges;
		}

		#selectedBlock span {
			font: 10px monospace;
		}

		#workspace {
			position: relative;
			min-width: 0;
			overflow: hidden;
			background: #111827;
		}

		#previewPane {
			position: absolute;
			inset: 0;
			min-width: 0;
			min-height: 0;
			overflow: hidden;
			background: #17191b;
		}

		#canvas,
		#game {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			image-rendering: pixelated;
		}

		#canvas {
			z-index: 1;
			cursor: crosshair;
			pointer-events: auto;
		}

		#game {
			background: #111827;
		}

		@media (max-width: 640px) {
			body {
				overflow: auto;
			}

			main {
				grid-template-columns: 1fr 60px;
				grid-template-rows: minmax(0, 1fr);
				height: calc(100vh - 58px);
			}

			aside {
				max-height: none;
				padding: 8px;
				border-left: 1px solid var(--line);
			}

			label {
				display: inline-block;
				margin: 5px 6px 5px 0;
			}

			#palette {
				grid-template-columns: 1fr;
			}

			#workspace {
				min-height: 420px;
			}
		}

	</style>
</head>

<body>
	<header>
		<div class="toolbar">
			<button class="icon-button" id="load" title="Reload world" aria-label="Reload world"><span class="material-symbols-rounded">refresh</span></button>
			<button class="icon-button" id="save" title="Save world JSON" aria-label="Save world JSON"><span class="material-symbols-rounded">save</span></button>
			<button class="icon-button" id="download" title="Download world JSON" aria-label="Download world JSON"><span class="material-symbols-rounded">download</span></button>
			<span class="toolbar-divider"></span>
			<button class="icon-button tool-button active" data-tool="select" title="Select and move tiles" aria-label="Select and move tiles"><span class="material-symbols-rounded">near_me</span></button>
			<button class="icon-button tool-button" data-tool="paint" title="Paint tiles" aria-label="Paint tiles"><span class="material-symbols-rounded">format_paint</span></button>
			<button class="icon-button tool-button" data-tool="erase" title="Erase tiles" aria-label="Erase tiles"><span class="material-symbols-rounded">ink_eraser</span></button>
			<button class="icon-button tool-button" data-tool="area-fill" title="Fill a rectangular area" aria-label="Fill a rectangular area"><span class="material-symbols-rounded">select_all</span></button>
			<button class="icon-button tool-button" data-tool="pan" title="Pan the camera" aria-label="Pan the camera"><span class="material-symbols-rounded">pan_tool</span></button>
			<button class="icon-button tool-button" data-tool="place-player" title="Place player" aria-label="Place player"><span class="material-symbols-rounded">person_pin</span></button>
			<span class="toolbar-divider"></span>
			<button class="icon-button" id="center" title="Center on player" aria-label="Center on player"><span class="material-symbols-rounded">my_location</span></button>
			<button class="icon-button" id="reset-spawn" title="Reset player to spawn" aria-label="Reset player to spawn"><span class="material-symbols-rounded">restart_alt</span></button>
			<label title="Show grid"><input id="grid" type="checkbox" checked aria-label="Show grid"><span class="material-symbols-rounded">grid_4x4</span></label>
			<label title="Snap to grid"><input id="snap" type="checkbox" checked aria-label="Snap to grid"><span class="material-symbols-rounded">grid_on</span></label>
			<span class="toolbar-divider"></span>
			<span class="material-symbols-rounded" title="Playtest zoom">zoom_in</span><input id="zoom" type="range" min="0.6" max="1.4" step="0.05" value="1" aria-label="Playtest zoom">
		</div>
	</header>
	<main>
		<aside>
			<div id="palette"></div>
		</aside>
		<section id="workspace">
			<div id="previewPane"><canvas id="game"></canvas><canvas id="canvas"></canvas>
				<div id="selectedBlock"><canvas id="selectedBlockCanvas"></canvas><span id="selectedBlockLabel">BLOCK</span></div>
				<div id="status"></div>
			</div>
		</section>
		<script type="module">
			import {
				gfx
			} from './assets/art/pixelart.js';
			import {
				Game
			} from './src/game.js';
			const symbols = [
				[' ', 'Empty'],
				['#', 'Block'],
				['!', 'Hazard'],
				['%', 'Portal'],
				['$', 'Trampoline'],
				['_', 'Mud'],
				['&', 'Ice'],
				['W', 'Water'],
				['F', 'Fire'],
				['@', 'Spawn']
			];
			const colors = {
				' ': '#111a21',
				'#': '#59645f',
				'!': '#d85e6b',
				'%': '#bc71d5',
				'$': '#d5c95e',
				'_': '#805238',
				'&': '#73c9d5',
				W: '#2566ba',
				F: '#e98548',
				'@': '#e9f1a1'
			};
			const canvas = document.querySelector('#canvas'),
				ctx = canvas.getContext('2d'),
				viewport = document.querySelector('#previewPane');
			const palette = document.querySelector('#palette'),
				status = document.querySelector('#status');
			const selectedBlockCanvas = document.querySelector('#selectedBlockCanvas'),
				selectedBlockLabel = document.querySelector('#selectedBlockLabel');
			const gridToggle = document.querySelector('#grid'),
				snapToggle = document.querySelector('#snap');
			let world = {
					version: 1,
					chunkSize: 16,
					loadRadius: 2,
					sectionGap: 0,
					sections: []
				},
				selected = '#',
				tool = 'select',
				action = 'Ready',
				pointer = null,
				move = null,
				rectangle = null,
				history = [],
				future = [],
				liveGame = null,
				previewSyncPending = false;

			function copyWorld() {
				return JSON.parse(JSON.stringify(world));
			}

			function remember() {
				history.push(copyWorld());
				if (history.length > 30) history.shift();
				future.length = 0;
			}

			function restore(snapshot) {
				world = snapshot;
				queuePreviewSync();
			}

			function queuePreviewSync() {
				if (!liveGame || previewSyncPending) return;
				previewSyncPending = true;
				requestAnimationFrame(() => {
					previewSyncPending = false;
					liveGame.levels.world = world;
					liveGame.levels.setup({
						preservePlayer: true
					});
				});
			}

			function buildContinuousMap(sourceWorld) {
				const height = Math.max(1, ...sourceWorld.sections.map(section => section.length));
				const rows = Array.from({
					length: height
				}, () => '');
				for (const section of sourceWorld.sections) {
					const width = Math.max(1, ...section.map(row => row.length));
					for (let y = 0; y < height; y++) rows[y] += (section[y] ?? '').padEnd(width, ' ');
				}
				return rows;
			}

			function sectionAtWorldCell(cell) {
				let originX = 0;
				for (const section of world.sections) {
					const width = Math.max(1, ...section.map(row => row.length));
					if (cell.x >= originX && cell.x < originX + width && cell.y >= 0 && cell.y < section.length) return {
						section,
						x: cell.x - originX,
						y: cell.y
					};
					originX += width;
				}
				return null;
			}

			function symbolAt(cell) {
				if (Array.isArray(world.map)) return world.map[cell.y]?.[cell.x] || ' ';
				const local = sectionAtWorldCell(cell);
				return local?.section[local.y]?.[local.x] || ' ';
			}

			function setCell(cell, value) {
				if (Array.isArray(world.map)) {
					if (cell.x < 0 || cell.y < 0 || cell.y >= world.map.length) return;
					world.map[cell.y] = world.map[cell.y].padEnd(cell.x + 1, ' ');
					world.map[cell.y] = world.map[cell.y].substring(0, cell.x) + value + world.map[cell.y].substring(cell.x + 1);
					return;
				}
				const local = sectionAtWorldCell(cell);
				if (!local || local.x < 0 || local.y < 0) return;
				local.section[local.y] = local.section[local.y].padEnd(local.x + 1, ' ');
				local.section[local.y] = local.section[local.y].substring(0, local.x) + value + local.section[local.y].substring(local.x + 1);
			}

			function placePlayer(cell) {
				if (!liveGame || cell.x < 0 || cell.y < 0) return;
				const size = liveGame.levels.grid?.size || 45;
				liveGame.player.x = cell.x * size;
				liveGame.player.y = cell.y * size;
				liveGame.player.xv = 0;
				liveGame.player.yv = 0;
				liveGame.player.generateHitbox();
				liveGame.player.pbox.set(liveGame.player.hbox);
				liveGame.camera.resetPan();
				liveGame.camera.x = liveGame.player.x * liveGame.camera.z;
				liveGame.camera.y = liveGame.player.y * liveGame.camera.z;
				liveGame.levels.updateStreaming(true);
				action = 'Player placed';
				draw();
			}

			function resetPlayerSpawn() {
				if (!liveGame) return;
				const spawn = liveGame.levels.spawn;
				liveGame.player.reset(spawn.x, spawn.y);
				liveGame.timer = 0;
				liveGame.camera.resetPan();
				liveGame.camera.x = spawn.x * liveGame.camera.z;
				liveGame.camera.y = spawn.y * liveGame.camera.z;
				liveGame.levels.updateStreaming(true);
				action = 'Spawn reset';
				draw();
			}

			function renderMaterial(target, symbol, x, y, size) {
				target.fillStyle = colors[symbol] || colors[' '];
				target.fillRect(x, y, size, size);
				if (symbol === '#') {
					const sprite = gfx?.tiles?.A?.yyyy;
					if (sprite) sprite.draw(target, x, y, size / sprite.w);
				} else if (symbol === 'W') {
					target.fillStyle = '#4fc3ff';
					target.fillRect(x, y, size, Math.max(2, size * .12));
					target.fillStyle = '#1f52b1';
					target.fillRect(x, y + size * .2, size, size * .8);
				} else if (symbol === 'F') {
					target.fillStyle = '#ffcf61';
					target.fillRect(x + size * .3, y + size * .15, size * .4, size * .7);
					target.fillStyle = '#f06d48';
					target.fillRect(x + size * .15, y + size * .4, size * .7, size * .45);
				} else if (symbol !== ' ') {
					target.fillStyle = 'rgba(10, 17, 22, .48)';
					target.font = `${Math.max(10, size * .55)}px monospace`;
					target.textAlign = 'center';
					target.textBaseline = 'middle';
					target.fillText(symbol, x + size / 2, y + size / 2);
				}
			}

			function renderPalettePreview(target, symbol, name) {
				target.clearRect(0, 0, target.canvas.width, target.canvas.height);
				if (symbol === '#') {
					renderMaterial(target, symbol, 0, 0, target.canvas.width);
					return;
				}
				target.fillStyle = '#f3eee6';
				target.font = `700 ${Math.max(5, Math.min(9, target.canvas.width / Math.max(4, name.length) * 1.5))}px system-ui, sans-serif`;
				target.textAlign = 'center';
				target.textBaseline = 'middle';
				target.fillText(name.toUpperCase(), target.canvas.width / 2, target.canvas.height / 2);
			}
			for (const [symbol, name] of symbols) {
				const button = document.createElement('button');
				button.className = 'swatch';
				button.dataset.symbol = symbol;
				button.title = `${name} tile`;
				button.setAttribute('aria-label', `${name} tile`);
				const preview = document.createElement('canvas');
				preview.width = 27;
				preview.height = 27;
				button.append(preview);
				renderPalettePreview(preview.getContext('2d'), symbol, name);
				button.onclick = () => {
					selected = symbol;
					action = `${name} selected`;
					updateSelectedBlock();
					document.querySelectorAll('.swatch').forEach(tile => tile.classList.toggle('active', tile.dataset.symbol === selected));
					draw();
				};
				palette.append(button);
			}

			function nameFor(symbol) {
				return symbols.find(([entry]) => entry === symbol)?.[1] || 'Tile';
			}

			function selectedName() {
				return nameFor(selected);
			}

			function updateSelectedBlock() {
				renderPalettePreview(selectedBlockCanvas.getContext('2d'), selected, selectedName());
				selectedBlockLabel.textContent = selectedName().toUpperCase();
			}
			updateSelectedBlock();

			function setTool(nextTool) {
				tool = nextTool;
				document.querySelectorAll('.tool-button').forEach(button => button.classList.toggle('active', button.dataset.tool === tool));
				action = `${nextTool[0].toUpperCase()}${nextTool.slice(1)} tool`;
				canvas.style.cursor = tool === 'pan' ? 'grab' : tool === 'select' ? 'default' : 'crosshair';
				draw();
			}
			document.querySelectorAll('.tool-button').forEach(button => button.addEventListener('click', () => setTool(button.dataset.tool)));

			function resizeCanvas() {
				canvas.width = Math.max(1, viewport.clientWidth);
				canvas.height = Math.max(1, viewport.clientHeight);
				draw();
			}

			function draw() {
				ctx.clearRect(0, 0, canvas.width, canvas.height);
				if (!liveGame) return;
				const camera = liveGame.camera,
					size = liveGame.levels.grid?.size || 45;
				const worldToScreen = (x, y) => ({
					x: x * camera.z - camera.x + canvas.width / 2,
					y: y * camera.z - camera.y + canvas.height / 2
				});
				const minX = Math.floor((camera.x - canvas.width / 2) / camera.z / size) - 1,
					maxX = Math.ceil((camera.x + canvas.width / 2) / camera.z / size) + 1;
				const minY = Math.floor((camera.y - canvas.height / 2) / camera.z / size) - 1,
					maxY = Math.ceil((camera.y + canvas.height / 2) / camera.z / size) + 1;
				if (gridToggle.checked) {
					ctx.strokeStyle = 'rgba(228, 161, 91, .2)';
					ctx.lineWidth = 1;
					for (let x = minX; x <= maxX; x++) {
						const point = worldToScreen(x * size, 0);
						ctx.beginPath();
						ctx.moveTo(Math.round(point.x) + .5, 0);
						ctx.lineTo(Math.round(point.x) + .5, canvas.height);
						ctx.stroke();
					}
					for (let y = minY; y <= maxY; y++) {
						const point = worldToScreen(0, y * size);
						ctx.beginPath();
						ctx.moveTo(0, Math.round(point.y) + .5);
						ctx.lineTo(canvas.width, Math.round(point.y) + .5);
						ctx.stroke();
					}
				}
				if (pointer) {
					const point = worldToScreen(pointer.x * size, pointer.y * size),
						scaled = size * camera.z;
					ctx.fillStyle = 'rgba(228, 161, 91, .18)';
					ctx.strokeStyle = '#e4a15b';
					ctx.fillRect(point.x, point.y, scaled, scaled);
					ctx.strokeRect(point.x + .5, point.y + .5, scaled - 1, scaled - 1);
				}
				if (rectangle) {
					const left = Math.min(rectangle.from.x, rectangle.to.x),
						right = Math.max(rectangle.from.x, rectangle.to.x);
					const top = Math.min(rectangle.from.y, rectangle.to.y),
						bottom = Math.max(rectangle.from.y, rectangle.to.y);
					const start = worldToScreen(left * size, top * size),
						width = (right - left + 1) * size * camera.z,
						height = (bottom - top + 1) * size * camera.z;
					ctx.globalAlpha = .42;
					for (let y = top; y <= bottom; y++)
						for (let x = left; x <= right; x++) {
							const point = worldToScreen(x * size, y * size);
							renderMaterial(ctx, selected, point.x, point.y, size * camera.z - 1);
						}
					ctx.globalAlpha = 1;
					ctx.fillStyle = 'rgba(228, 161, 91, .16)';
					ctx.fillRect(start.x, start.y, width, height);
					ctx.strokeStyle = '#e5be67';
					ctx.strokeRect(start.x + .5, start.y + .5, width - 1, height - 1);
				}
				if (move) {
					const point = worldToScreen(move.to.x * size, move.to.y * size),
						scaled = size * camera.z;
					ctx.globalAlpha = .68;
					renderMaterial(ctx, move.symbol, point.x, point.y, scaled - 1);
					ctx.globalAlpha = 1;
					ctx.strokeStyle = '#e5be67';
					ctx.strokeRect(point.x + 1, point.y + 1, scaled - 3, scaled - 3);
				}
				status.textContent = `${action}  |  ${selectedName()}  |  ${snapToggle.checked ? 'Snap' : 'Free'}  |  ${Math.round(liveGame.camera.z * 100)}%  |  ${liveGame.levels.loadedChunks.size} chunks`;
			}

			function cellAt(event) {
				if (!liveGame) return {
					x: -1,
					y: -1
				};
				const size = liveGame.levels.grid?.size || 45,
					camera = liveGame.camera;
				return {
					x: Math.floor((event.offsetX - canvas.width / 2 + camera.x) / camera.z / size),
					y: Math.floor((event.offsetY - canvas.height / 2 + camera.y) / camera.z / size)
				};
			}

			function paint(cell, value = selected) {
				if (!pointer.stroke) {
					remember();
					pointer.stroke = true;
				}
				setCell(cell, value);
				action = value === ' ' ? 'Erasing tile' : `Painting ${nameFor(value)}`;
				queuePreviewSync();
				draw();
			}

			function fillRectangle(from, to) {
				remember();
				const left = Math.min(from.x, to.x),
					right = Math.max(from.x, to.x),
					top = Math.min(from.y, to.y),
					bottom = Math.max(from.y, to.y);
				for (let y = top; y <= bottom; y++)
					for (let x = left; x <= right; x++) setCell({
						x,
						y
					}, selected);
				action = `Filled ${right - left + 1} x ${bottom - top + 1}`;
				queuePreviewSync();
			}
			canvas.addEventListener('pointerdown', event => {
				canvas.setPointerCapture(event.pointerId);
				const cell = cellAt(event);
				pointer = {
					...cell,
					clientX: event.clientX,
					clientY: event.clientY
				};
				if (event.button === 2) {
					pointer.painting = true;
					paint(cell, selected);
					return;
				}
				if (event.button !== 0) return;
				if (tool === 'pan') {
					pointer.panning = true;
					action = 'Panning';
					draw();
					return;
				}
				if (tool === 'place-player') {
					placePlayer(cell);
					pointer = null;
					return;
				}
				if (tool === 'area-fill') {
					rectangle = {
						from: cell,
						to: cell
					};
					action = `Filling ${selectedName()}`;
					draw();
					return;
				}
				if (tool === 'paint') {
					paint(cell, selected);
					return;
				}
				if (tool === 'erase') {
					paint(cell, ' ');
					return;
				}
				const symbol = symbolAt(cell);
				if (symbol !== ' ') {
					remember();
					move = {
						from: cell,
						to: {
							...cell
						},
						symbol
					};
					setCell(cell, ' ');
					action = `Moving ${nameFor(symbol)}`;
					queuePreviewSync();
				} else action = 'Ready';
				draw();
			});
			canvas.addEventListener('pointermove', event => {
				if (!pointer) return;
				if (pointer.panning) {
					const dx = event.clientX - pointer.clientX,
						dy = event.clientY - pointer.clientY;
					if (liveGame) liveGame.camera.panBy(-dx, -dy);
					pointer.clientX = event.clientX;
					pointer.clientY = event.clientY;
					draw();
					return;
				}
				const cell = cellAt(event);
				pointer = {
					...pointer,
					...cell,
					clientX: event.clientX,
					clientY: event.clientY
				};
				if (rectangle) {
					rectangle.to = cell;
					draw();
					return;
				}
				if (move) {
					move.to = snapToggle.checked ? cell : {
						x: (event.offsetX - canvas.width / 2 + liveGame.camera.x) / liveGame.camera.z / (liveGame.levels.grid?.size || 45),
						y: (event.offsetY - canvas.height / 2 + liveGame.camera.y) / liveGame.camera.z / (liveGame.levels.grid?.size || 45)
					};
					draw();
				} else if (pointer.painting && (event.buttons & 2)) paint(cell, selected);
				else if ((tool === 'paint' || tool === 'erase') && (event.buttons & 1)) paint(cell, tool === 'erase' ? ' ' : selected);
				else draw();
			});
			canvas.addEventListener('pointerup', event => {
				if (!pointer) return;
				if (rectangle) {
					fillRectangle(rectangle.from, rectangle.to);
					rectangle = null;
				} else if (move) {
					setCell({
						x: Math.round(move.to.x),
						y: Math.round(move.to.y)
					}, move.symbol);
					action = `Moved ${nameFor(move.symbol)}`;
					move = null;
					queuePreviewSync();
				} else if (pointer.painting) action = 'Paint complete';
				else if (pointer.panning) action = 'Pan complete';
				pointer = null;
				draw();
			});
			canvas.addEventListener('pointerleave', () => {
				if (!move && !pointer?.painting) pointer = null;
				draw();
			});
			canvas.addEventListener('contextmenu', event => event.preventDefault());
			canvas.addEventListener('wheel', event => {
				event.preventDefault();
				if (!liveGame) return;
				liveGame.camera.z = Math.max(.6, Math.min(1.4, liveGame.camera.z * (event.deltaY < 0 ? 1.1 : .9)));
				document.querySelector('#zoom').value = liveGame.camera.z;
				action = `Zoom ${Math.round(liveGame.camera.z * 100)}%`;
				draw();
			}, {
				passive: false
			});
			document.querySelector('#zoom').oninput = event => {
				if (liveGame) liveGame.camera.z = Number(event.target.value);
				action = `Zoom ${Math.round(Number(event.target.value) * 100)}%`;
				draw();
			};
			gridToggle?.addEventListener('change', draw);
			snapToggle?.addEventListener('change', draw);
			document.querySelector('#center')?.addEventListener('click', () => {
				if (liveGame) {
					liveGame.camera.resetPan();
					liveGame.camera.x = liveGame.player.x * liveGame.camera.z;
					liveGame.camera.y = liveGame.player.y * liveGame.camera.z;
				}
				action = 'Centered';
				draw();
			});
			document.querySelector('#reset-spawn')?.addEventListener('click', resetPlayerSpawn);
			async function loadWorld() {
				const response = await fetch('../game/world.json?editor=' + Date.now());
				world = await response.json();
				world.map ??= buildContinuousMap(world);
				history.length = 0;
				future.length = 0;
				queuePreviewSync();
			}

			function serialized() {
				return JSON.stringify(world, null, 2) + '\n';
			}
			async function saveWorld() {
				if (window.showSaveFilePicker) {
					const handle = await showSaveFilePicker({
						suggestedName: 'world.json',
						types: [{
							description: 'JSON',
							accept: {
								'application/json': ['.json']
							}
						}]
					});
					const writer = await handle.createWritable();
					await writer.write(serialized());
					await writer.close();
					action = 'World saved';
					draw();
				} else downloadWorld();
			}

			function downloadWorld() {
				const blob = new Blob([serialized()], {
						type: 'application/json'
					}),
					link = document.createElement('a');
				link.href = URL.createObjectURL(blob);
				link.download = 'world.json';
				link.click();
				URL.revokeObjectURL(link.href);
			}
			document.querySelector('#load').onclick = () => loadWorld().catch(error => status.textContent = error.message);
			document.querySelector('#save').onclick = () => saveWorld().catch(error => status.textContent = error.message);
			document.querySelector('#download').onclick = downloadWorld;
			window.addEventListener('keydown', event => {
				if (event.target.matches('input, select')) return;
				if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'z' && history.length) {
					future.push(copyWorld());
					restore(history.pop());
					action = 'Undo';
					draw();
				}
				if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'y' && future.length) {
					history.push(copyWorld());
					restore(future.pop());
					action = 'Redo';
					draw();
				}
			});
			async function startLivePreview() {
				liveGame = new Game('game');
				await liveGame.start();
				liveGame.levels.world = world;
				liveGame.levels.setup();
				resizeCanvas();
				liveGame.camera.z = Number(document.querySelector('#zoom').value);
				action = 'Ready';
				draw();
			}
			window.addEventListener('resize', resizeCanvas);
			resizeCanvas();
			loadWorld().then(startLivePreview).catch(error => {
				action = 'World failed to load';
				status.textContent = action;
			});

		</script>
</body>

</html>
